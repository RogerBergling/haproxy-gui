name: haproxy-workbench

# Quick start:
#   docker compose up -d
#   open http://localhost:8004
#
# The image is published at ghcr.io/rogerbergling/haproxy-gui:latest.
# Nothing is persisted in the container: configurations and history live in
# the browser's localStorage. See the in-app Security & privacy page.

services:
  haproxy-workbench:
    image: ghcr.io/rogerbergling/haproxy-gui:latest
    container_name: haproxy-workbench
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 128m
    ports:
      - "8004:8080"
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=haproxy-gui"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8080/', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Auto-update the application image every 5 minutes when a newer image is
  # available. Watchtower mounts the Docker socket, which is host-level
  # privilege. Remove this service if you do not want automatic updates.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
    labels:
      - "com.centurylinklabs.watchtower.scope=haproxy-gui"
    command: --interval 300 --label-enable --scope haproxy-gui --cleanup
